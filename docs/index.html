<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA Lease Watch | The Avens Group</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #44546A; --navy-deep: #36435A; --orange: #ED7D31; --orange-tint: #FAD7BE;
    --navy-tint: #D6DCE4; --gray: #E7E6E6; --silver: #A5A5A5; --ink: #1F2633; --paper: #FFFFFF;
    --body: "Century Gothic", "Questrial", "Avenir Next", Avenir, sans-serif;
    --title: "Calibri Light", "Segoe UI Light", "Questrial", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F5F7; color: var(--ink); font: 14px/1.5 var(--body); }
  a { color: var(--navy); }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  header { background: var(--navy); color: #fff; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 22px 0 6px; flex-wrap: wrap; }
  h1 { font: 300 30px/1.1 var(--title); margin: 0; letter-spacing: .01em; }
  .titlebar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .feeds { display: flex; border: 1px solid var(--navy-tint); border-radius: 3px; overflow: hidden; }
  .feeds a { color: var(--navy-tint); text-decoration: none; padding: 4px 14px; font-size: 13px; }
  .feeds a[aria-current="page"] { background: var(--orange); color: #fff; }
  .stamp { color: var(--navy-tint); font-size: 12px; }
  .summary { font-size: 17px; padding: 6px 0 18px; color: #fff; max-width: 70ch; }
  .summary b { color: var(--orange-tint); font-weight: normal; border-bottom: 2px solid var(--orange); }

  nav.views { display: flex; gap: 2px; }
  nav.views button { white-space: nowrap; background: transparent; color: var(--navy-tint); border: 0; font: inherit; padding: 10px 16px;
    cursor: pointer; border-top: 3px solid transparent; }
  nav.views button[aria-pressed="true"] { background: #F4F5F7; color: var(--navy); border-top-color: var(--orange); }
  nav.views .n { font-size: 12px; opacity: .75; margin-left: 4px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; padding: 18px 0 10px; align-items: center; }
  .controls input, .controls select { font: inherit; padding: 8px 10px; border: 1px solid #C9CED6; background: #fff; border-radius: 3px; }
  .controls input { flex: 1 1 240px; }
  .controls .spacer { flex: 1; }
  .btn { font: inherit; background: #fff; border: 1px solid var(--navy); color: var(--navy); padding: 8px 12px; border-radius: 3px; cursor: pointer; }
  .btn:hover { background: var(--navy-tint); }

  ol.list { list-style: none; margin: 0 0 40px; padding: 0; background: var(--paper); border: 1px solid var(--gray); }
  li.opp { display: grid; grid-template-columns: 92px 1fr 150px; border-bottom: 1px solid var(--gray); }
  li.opp:last-child { border-bottom: 0; }
  li.opp.passed { opacity: .5; }

  .clock { padding: 16px 10px; text-align: center; border-right: 1px solid var(--gray); background: #FAFBFC; }
  .clock .days { font: 300 34px/1 var(--title); color: var(--navy); }
  .clock .unit { font-size: 11px; color: #6B7380; }
  .clock .date { font-size: 12px; color: var(--ink); margin-top: 6px; }
  .clock.hot { background: var(--orange); }
  .clock.hot .days, .clock.hot .unit, .clock.hot .date { color: #fff; }
  .clock.past .days { color: var(--silver); }
  .clock.none .days { font-size: 20px; color: var(--silver); padding-top: 8px; }

  .main { padding: 14px 18px; min-width: 0; }
  .main h2 { font: 600 15px/1.35 var(--body); margin: 0 0 4px; }
  .main h2 a { text-decoration: none; }
  .main h2 a:hover { text-decoration: underline; }
  .meta { color: #4A5260; font-size: 13px; }
  .meta span + span::before { content: "|"; color: var(--silver); margin: 0 7px; }
  .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--navy-tint); color: var(--navy-deep); }
  .tag.new { background: var(--orange); color: #fff; }
  .tag.sdvosb { background: var(--orange-tint); color: #8A3E0B; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--navy); }
  details .more { padding: 8px 0 2px; color: #4A5260; }
  textarea { width: 100%; min-height: 60px; font: inherit; padding: 8px; border: 1px solid #C9CED6; border-radius: 3px; margin-top: 6px; }

  .side { padding: 14px 14px; border-left: 1px solid var(--gray); }
  .side label { display: block; font-size: 11px; color: #6B7380; margin-bottom: 4px; }
  .side select { width: 100%; font: inherit; padding: 6px; border: 1px solid #C9CED6; border-radius: 3px; background: #fff; }
  .side select.s-pursuing { border-color: var(--orange); background: var(--orange-tint); }
  .side select.s-watching { background: var(--navy-tint); }

  li.group { background: var(--navy-tint); color: var(--navy-deep); font-weight: 600; font-size: 13px;
    padding: 7px 14px; border-bottom: 1px solid var(--gray); }
  li.group span { font-weight: normal; opacity: .7; margin-left: 4px; }
  .empty { padding: 40px 20px; text-align: center; color: #4A5260; background: #fff; border: 1px solid var(--gray); }
  footer { color: var(--silver); font-size: 12px; padding: 0 0 30px; border-top: 3px solid var(--orange); padding-top: 10px; }

  @media (max-width: 720px) {
    li.opp { grid-template-columns: 74px 1fr; }
    .side { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--gray); display: flex; gap: 10px; align-items: center; }
    .side label { margin: 0; white-space: nowrap; }
    .clock .days { font-size: 28px; }
    nav.views { overflow-x: auto; }
  }
  @media (prefers-reduced-motion: no-preference) {
    li.opp { transition: opacity .2s; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="masthead">
      <div class="titlebar"><h1 id="feedTitle">VA Lease Watch</h1>
        <nav class="feeds" aria-label="Agency"><a href="./" data-feed="va">VA</a><a href="./?feed=gsa" data-feed="gsa">GSA</a></nav></div>
      <div class="stamp" id="stamp">Loading SAM.gov data…</div>
    </div>
    <p class="summary" id="summary"></p>
    <nav class="views" aria-label="Views">
      <button data-view="open" aria-pressed="true">Open<span class="n"></span></button>
      <button data-view="soon" aria-pressed="false">Due in 60 days<span class="n"></span></button>
      <button data-view="awards" aria-pressed="false">Awards<span class="n"></span></button>
      <button data-view="all" aria-pressed="false">All<span class="n"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <input id="q" type="search" placeholder="Search title, city, solicitation number" aria-label="Search">
    <select id="state" aria-label="State"><option value="">All states</option></select>
    <select id="status" aria-label="My status">
      <option value="">Any status</option>
      <option value="unreviewed">Unreviewed</option>
      <option value="watching">Watching</option>
      <option value="pursuing">Pursuing</option>
      <option value="passed">Passed</option>
    </select>
    <span class="spacer"></span>
    <button class="btn" id="csv">Download CSV</button>
  </div>
  <ol class="list" id="list"></ol>
  <footer>The Avens Group | 303-731-0530 | GoAvens.com. Data from the SAM.gov Get Opportunities API, refreshed each weekday morning. Your status and notes are saved in this browser only.</footer>
</main>

<script>
(() => {
  const FEEDS = {
    va:  { name: "VA Lease Watch",  noun: "VA lease notice",  data: "data/opportunities.json", store: "vlw:" },
    gsa: { name: "GSA Lease Watch", noun: "GSA lease notice", data: "data/gsa.json",           store: "glw:" }
  };
  const feedKey = new URLSearchParams(location.search).get("feed") === "gsa" ? "gsa" : "va";
  const FEED = FEEDS[feedKey];
  document.title = FEED.name + " | The Avens Group";
  document.getElementById("feedTitle").textContent = FEED.name;
  for (const a of document.querySelectorAll(".feeds a")) a.setAttribute("aria-current", a.dataset.feed === feedKey ? "page" : "false");
  const SOON = 60, HOT = 15;
  const BUCKETS = [[5, "Due within 5 days"], [10, "Due in 6 to 10 days"], [15, "Due in 11 to 15 days"],
                   [30, "Due in 16 to 30 days"], [45, "Due in 31 to 45 days"], [60, "Due in 46 to 60 days"]];
  const bucketOf = n => BUCKETS.find(b => n <= b[0]);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let items = [], latestSeen = "", view = "open";

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(FEED.store + k)) || {}; } catch { return {}; } },
    set(k, v) { try { localStorage.setItem(FEED.store + k, JSON.stringify(v)); } catch {} }
  };
  const marks = store.get("marks");   // { id: { status, note } }

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isAward = r => /award/i.test(r.type);
  const daysLeft = r => r.deadline ? Math.round((new Date(r.deadline + "T00:00:00") - today) / 864e5) : null;
  const statusOf = r => (marks[r.id] && marks[r.id].status) || "unreviewed";
  const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

  const superseded = new Set();
  const views = {
    open: r => !superseded.has(r.id) && !isAward(r) && (daysLeft(r) === null || daysLeft(r) >= 0),
    soon: r => !superseded.has(r.id) && !isAward(r) && daysLeft(r) !== null && daysLeft(r) >= 0 && daysLeft(r) <= SOON,
    awards: r => isAward(r),
    all: () => true
  };

  function filtered() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const st = document.getElementById("state").value;
    const ms = document.getElementById("status").value;
    return items.filter(r => views[view](r)
      && (!st || r.state === st)
      && (!ms || statusOf(r) === ms)
      && (!q || [r.title, r.city, r.state, r.solnum, r.office].join(" ").toLowerCase().includes(q)))
      .sort((a, b) => {
        if (view === "awards" || view === "all") return (b.posted || "").localeCompare(a.posted || "");
        const da = daysLeft(a), db = daysLeft(b);
        if (da === null) return 1; if (db === null) return -1; return da - db;
      });
  }

  function clock(r) {
    const n = daysLeft(r);
    if (isAward(r)) return `<div class="clock none"><div class="days">Award</div><div class="date">${r.posted ? fmt(r.posted.slice(0, 10)) : ""}</div></div>`;
    if (n === null) return `<div class="clock none"><div class="days">No date</div><div class="unit">response</div></div>`;
    const cls = n < 0 ? "past" : n <= HOT ? "hot" : "";
    const unit = n < 0 ? "closed" : n === 1 ? "day left" : "days left";
    return `<div class="clock ${cls}"><div class="days">${n < 0 ? "–" : n}</div><div class="unit">${unit}</div><div class="date">${fmt(r.deadline)}</div></div>`;
  }

  function render() {
    for (const b of document.querySelectorAll("nav.views button")) {
      b.setAttribute("aria-pressed", b.dataset.view === view);
      b.querySelector(".n").textContent = items.filter(views[b.dataset.view]).length;
    }
    const rows = filtered();
    const list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = `<li class="empty">No notices match these filters. Clear the search or pick a different view.</li>`;
      return;
    }
    let lastBucket = null;
    list.innerHTML = rows.map(r => {
      let groupHead = "";
      if (view === "soon") {
        const b = bucketOf(daysLeft(r));
        if (b !== lastBucket) {
          const count = rows.filter(x => bucketOf(daysLeft(x)) === b).length;
          groupHead = `<li class="group">${b[1]} <span>${count}</span></li>`;
          lastBucket = b;
        }
      }
      const s = statusOf(r), note = (marks[r.id] && marks[r.id].note) || "";
      const where = [r.city, r.state].filter(Boolean).join(", ") || "Location not listed";
      const tags = [
        r.firstSeen === latestSeen ? `<span class="tag new">New today</span>` : "",
        r.isUpdate ? `<span class="tag">Amendment</span>` : "",
        r.setAside ? `<span class="tag ${/service-disabled|sdvosb/i.test(r.setAside) ? "sdvosb" : ""}">${esc(r.setAside.replace(/\s*\(FAR.*\)$/, ""))}</span>` : "",
        isAward(r) && r.awardee ? `<span class="tag">Awarded to ${esc(r.awardee)}${r.awardAmount ? " | $" + Number(r.awardAmount).toLocaleString() : ""}</span>` : ""
      ].join("");
      return groupHead + `<li class="opp ${s === "passed" ? "passed" : ""}" data-id="${esc(r.id)}">
        ${clock(r)}
        <div class="main">
          <h2><a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a></h2>
          <div class="meta"><span>${esc(where)}</span><span>${esc(r.type)}</span>${r.solnum ? `<span>${esc(r.solnum)}</span>` : ""}</div>
          <div class="tags">${tags}</div>
          <details ${note ? "open" : ""}><summary>Contact and notes</summary>
            <div class="more">${esc(r.office)}${r.poc && r.poc.name ? `<br>${esc(r.poc.name)}` : ""}${r.poc && r.poc.email ? ` | <a href="mailto:${esc(r.poc.email)}">${esc(r.poc.email)}</a>` : ""}${r.poc && r.poc.phone ? ` | ${esc(r.poc.phone)}` : ""}
            <br>Posted ${r.posted ? fmt(r.posted.slice(0, 10)) : "n/a"} | NAICS ${esc(r.naics)}</div>
            <textarea data-note placeholder="Notes for this notice">${esc(note)}</textarea>
          </details>
        </div>
        <div class="side"><label for="s-${esc(r.id)}">My status</label>
          <select id="s-${esc(r.id)}" data-status class="s-${s}">
            ${["unreviewed", "watching", "pursuing", "passed"].map(o => `<option value="${o}" ${o === s ? "selected" : ""}>${o[0].toUpperCase() + o.slice(1)}</option>`).join("")}
          </select></div>
      </li>`;
    }).join("");
  }

  function save(id, patch) {
    marks[id] = Object.assign({}, marks[id], patch);
    store.set("marks", marks);
  }

  document.getElementById("list").addEventListener("change", e => {
    const li = e.target.closest("li.opp"); if (!li) return;
    if (e.target.matches("[data-status]")) { save(li.dataset.id, { status: e.target.value }); render(); }
  });
  document.getElementById("list").addEventListener("input", e => {
    const li = e.target.closest("li.opp");
    if (li && e.target.matches("[data-note]")) save(li.dataset.id, { note: e.target.value });
  });
  for (const id of ["q", "state", "status"]) document.getElementById(id).addEventListener("input", render);
  document.querySelector("nav.views").addEventListener("click", e => {
    const b = e.target.closest("button"); if (b) { view = b.dataset.view; render(); }
  });

  document.getElementById("csv").addEventListener("click", () => {
    const cols = ["title", "city", "state", "type", "solnum", "deadline", "posted", "setAside", "office", "link"];
    const lines = [cols.concat("myStatus", "myNotes").join(",")].concat(filtered().map(r =>
      cols.map(c => r[c]).concat(statusOf(r), (marks[r.id] && marks[r.id].note) || "")
        .map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = `${feedKey}-lease-watch-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  });

  fetch(FEED.data, { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      items = Object.values(data.items || {});
      const newest = {};
      for (const r of items) if (r.solnum && !isAward(r)) {
        const o = newest[r.solnum];
        if (!o) newest[r.solnum] = r;
        else if ((r.posted || "") > (o.posted || "")) { superseded.add(o.id); newest[r.solnum] = r; }
        else superseded.add(r.id);
      }
      latestSeen = items.reduce((m, r) => r.firstSeen > m ? r.firstSeen : m, "");
      const updated = data.updated ? new Date(data.updated) : null;
      document.getElementById("stamp").textContent = updated
        ? "Updated " + updated.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
        : "Not updated yet";
      const fresh = items.filter(r => r.firstSeen === latestSeen && !isAward(r)).length;
      const soon = items.filter(views.soon).length;
      const pursuing = items.filter(r => statusOf(r) === "pursuing").length;
      document.getElementById("summary").innerHTML =
        `<b>${fresh}</b> new ${FEED.noun}${fresh === 1 ? "" : "s"} in the latest pull. ` +
        `<b>${soon}</b> response${soon === 1 ? "" : "s"} due in the next 60 days, <b>${items.filter(r => views.soon(r) && daysLeft(r) <= HOT).length}</b> within 15 days` +
        (pursuing ? `, and you're pursuing <b>${pursuing}</b>.` : ".");
      const states = [...new Set(items.map(r => r.state).filter(Boolean))].sort();
      document.getElementById("state").insertAdjacentHTML("beforeend", states.map(s => `<option>${s}</option>`).join(""));
      render();
    })
    .catch(() => {
      document.getElementById("stamp").textContent = "Data unavailable";
      document.getElementById("list").innerHTML = `<li class="empty">The data file hasn't been created yet. Run the "Daily SAM.gov VA lease pull" workflow once from the Actions tab, then reload.</li>`;
    });
})();
</script>
</body>
</html>
